<figure class="tweet-quote">
  <blockquote cite="{{ include.url }}">
    {{ include.text }}
  </blockquote>
  <figcaption>
    <a href="{{ include.url }}" rel="noopener nofollow">
      <strong>{{ include.author }}</strong>
      <span class="tweet-handle">@{{ include.handle }}</span>
      <span class="tweet-date">{{ include.date }}</span>
    </a>
  </figcaption>
</figure>

<style>
  .tweet-quote {
    margin: 2em 0;
    padding: 1.25em 1.5em;
    border: 1px solid var(--color-border);
    border-left: 3px solid var(--color-accent);
    border-radius: 4px;
    background: var(--color-bg-hover);
  }
  .tweet-quote blockquote {
    margin: 0;
    padding: 0;
    border: none;
    font-size: 1.05em;
    line-height: 1.55;
    color: var(--color-text);
  }
  .tweet-quote figcaption {
    margin-top: 0.9em;
    font-size: 0.85em;
    color: var(--color-text-secondary);
  }
  .tweet-quote figcaption a {
    color: inherit;
    text-decoration: none;
  }
  .tweet-quote figcaption a:hover strong {
    color: var(--color-accent);
  }
  .tweet-quote .tweet-handle,
  .tweet-quote .tweet-date {
    margin-left: 0.5em;
  }
</style>
